<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            /* Ukrainian flag diagonal stripe pattern */
            background:
                repeating-linear-gradient(
                    -45deg,
                    #0057b7 0px,
                    #0057b7 28px,
                    #ffd700 28px,
                    #ffd700 56px
                );
            cursor: none;
        }
        #stage {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .cat {
            position: absolute;
            font-size: 64px;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
            transition: transform 0.05s linear;
            will-change: transform, left, top;
        }
        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(6px);
            z-index: 10;
            pointer-events: none;
            opacity: 0.9;
        }
        .back {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            background: rgba(255,255,255,0.9);
            color: #1e293b;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-size: 0.9rem;
            cursor: pointer;
        }
        .back:hover { background: #fff; }
        .cursor-dot {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #0057b7;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <a class="back" href="/">← Home</a>
    <div class="hint">🐱 Рухай мишкою — котик біжить за тобою · Click for more cats</div>
    <div class="cursor-dot" id="dot"></div>
    <div id="stage"></div>

    <script>
        (function () {
            const stage = document.getElementById('stage');
            const dot = document.getElementById('dot');
            const CATS = ['🐱', '🐈', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾', '🐈‍⬛'];

            let mx = window.innerWidth / 2;
            let my = window.innerHeight / 2;

            class Cat {
                constructor(x, y) {
                    this.el = document.createElement('div');
                    this.el.className = 'cat';
                    this.el.textContent = CATS[Math.floor(Math.random() * CATS.length)];
                    this.x = x ?? Math.random() * window.innerWidth;
                    this.y = y ?? Math.random() * window.innerHeight;
                    this.vx = 0;
                    this.vy = 0;
                    this.speed = 0.04 + Math.random() * 0.06;
                    this.wobble = Math.random() * Math.PI * 2;
                    this.size = 48 + Math.random() * 36;
                    this.el.style.fontSize = this.size + 'px';
                    stage.appendChild(this.el);
                    this.render();
                }
                update() {
                    const dx = mx - this.x;
                    const dy = my - this.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    // spring toward cursor with lag
                    this.vx += (dx / dist) * this.speed * Math.min(dist, 200) * 0.02;
                    this.vy += (dy / dist) * this.speed * Math.min(dist, 200) * 0.02;
                    this.vx *= 0.92;
                    this.vy *= 0.92;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.wobble += 0.12;
                    const angle = Math.atan2(this.vy, this.vx);
                    const bounce = Math.sin(this.wobble) * 6;
                    this.el.style.left = this.x + 'px';
                    this.el.style.top = (this.y + bounce) + 'px';
                    this.el.style.transform = `translate(-50%, -50%) rotate(${angle * 20}deg) scaleX(${this.vx < -0.5 ? -1 : 1})`;
                }
                render() {
                    this.el.style.left = this.x + 'px';
                    this.el.style.top = this.y + 'px';
                    this.el.style.transform = 'translate(-50%, -50%)';
                }
            }

            const cats = [new Cat(), new Cat(), new Cat()];

            window.addEventListener('mousemove', (e) => {
                mx = e.clientX;
                my = e.clientY;
                dot.style.left = mx + 'px';
                dot.style.top = my + 'px';
            });

            window.addEventListener('click', (e) => {
                if (e.target.closest('a')) return;
                cats.push(new Cat(e.clientX, e.clientY));
                if (cats.length > 24) {
                    const old = cats.shift();
                    old.el.remove();
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches[0]) {
                    mx = e.touches[0].clientX;
                    my = e.touches[0].clientY;
                    dot.style.left = mx + 'px';
                    dot.style.top = my + 'px';
                }
            }, { passive: true });

            function loop() {
                for (const c of cats) c.update();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
