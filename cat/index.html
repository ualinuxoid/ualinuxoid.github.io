<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>🐱 Слава Україні</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f0e6;
            cursor: none;
        }
        #stage { position: relative; width: 100%; height: 100%; }

        .blotch {
            position: fixed;
            pointer-events: auto;
            z-index: 0;
            opacity: 0.38;
            background-image: url('/assets/blotch.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }
        .blotch:hover { opacity: 0.52; }

        .edge-cat {
            position: fixed;
            opacity: 0.22;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .edge-cat svg { width: 100%; height: 100%; display: block; }

        .cat {
            position: absolute;
            width: 56px;
            height: 56px;
            z-index: 5;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform, left, top, opacity;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.28));
            transition: filter 0.15s, opacity 0.9s ease;
            opacity: 1;
        }
        .cat:hover { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)) brightness(1.05); }
        .cat.fading { opacity: 0; pointer-events: none; }
        .cat svg { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }

        .ua-badge {
            position: absolute;
            right: -4px;
            top: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(180deg, #0057b7 50%, #ffd700 50%);
            box-shadow: 0 1px 4px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.7);
            pointer-events: none;
            z-index: 2;
        }

        .trail {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(100, 80, 60, 0.25);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .bubble {
            position: absolute;
            z-index: 20;
            max-width: 220px;
            padding: 10px 16px;
            background: #fff;
            color: #1e293b;
            font-weight: 700;
            font-size: 0.92rem;
            line-height: 1.35;
            pointer-events: none;
            text-align: center;
            will-change: left, top;
            animation: bubbleIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bubble.b1 {
            border-radius: 18px 18px 18px 4px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.22), 0 0 0 3px rgba(0, 87, 183, 0.12);
        }
        .bubble.b1::after {
            content: ''; position: absolute; bottom: -8px; left: 18px;
            width: 14px; height: 14px; background: #fff;
            transform: rotate(45deg); border-radius: 2px;
            box-shadow: 2px 2px 3px rgba(0,0,0,0.06);
        }
        .bubble.b2 {
            border-radius: 50% / 40%;
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
            padding: 12px 18px;
        }
        .bubble.b2::after {
            content: ''; position: absolute; bottom: -6px; left: 22px;
            width: 18px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.08);
        }
        .bubble.b3 {
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.22);
            padding: 10px 14px;
        }
        .bubble.b3::after {
            content: ''; position: absolute; bottom: -10px; left: 20px;
            width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 12px solid #fff;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.4) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .bubble.out { animation: bubbleOut 0.35s ease forwards; }
        @keyframes bubbleOut {
            to { opacity: 0; transform: scale(0.6) translateY(-20px); }
        }

        .top-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 40;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }
        .back {
            background: rgba(255,255,255,0.92); color: #1e293b;
            text-decoration: none; font-weight: 700; padding: 8px 14px;
            border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-size: 0.88rem;
        }
        .back:hover { background: #fff; }
        .controls {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .lang-switch {
            display: flex; gap: 3px;
            background: rgba(255,255,255,0.9);
            border-radius: 40px; padding: 3px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .lang-btn {
            border: none; background: transparent; padding: 5px 11px; border-radius: 30px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer; color: #64748b;
            font-family: inherit;
        }
        .lang-btn.active {
            background: #fff; color: #1e293b;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }
        .ctrl-btn {
            border: none;
            background: rgba(255,255,255,0.92);
            color: #1e293b;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            font-family: inherit;
        }
        .ctrl-btn:hover { background: #fff; }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            backdrop-filter: blur(6px);
            z-index: 30;
            pointer-events: none;
            text-align: center;
            max-width: 92vw;
            transition: opacity 0.3s, transform 0.3s;
        }
        .hint.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(16px);
            pointer-events: none;
        }

        .cursor-dot {
            position: fixed;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #0057b7;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="back" href="/" data-i18n="back">← Home</a>
        <div class="controls">
            <div class="lang-switch" role="group" aria-label="Language">
                <button class="lang-btn active" data-lang="uk" type="button">🇺🇦 Укр</button>
                <button class="lang-btn" data-lang="en" type="button">🇬🇧 Eng</button>
            </div>
            <button class="ctrl-btn" id="footerToggle" type="button" data-i18n="hide-footer">Сховати підказку</button>
        </div>
    </div>
    <div class="hint" id="hint" data-i18n="hint">🐱 Клікай котика — він скаже правду · Рухай мишкою · Click = more cats</div>
    <div class="cursor-dot" id="dot"></div>
    <div id="blotches"></div>
    <div id="edges"></div>
    <div id="stage"></div>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="cat-a" viewBox="0 0 64 64">
            <path fill="#1a1a1a" d="M12 28c0-10 8-18 20-18s20 8 20 18c2 2 6 6 6 12 0 10-10 18-26 18S6 50 6 40c0-6 4-10 6-12z"/>
            <path fill="#1a1a1a" d="M18 12l-4-8 10 6M46 12l4-8-10 6"/>
            <ellipse fill="#5a9e3a" cx="26" cy="30" rx="3.2" ry="3.5"/>
            <ellipse fill="#5a9e3a" cx="38" cy="30" rx="3.2" ry="3.5"/>
            <ellipse fill="#1a1a1a" cx="26" cy="30" rx="1.1" ry="2.2"/>
            <ellipse fill="#1a1a1a" cx="38" cy="30" rx="1.1" ry="2.2"/>
            <circle fill="#fff" cx="25.2" cy="28.8" r="0.7" opacity="0.85"/>
            <circle fill="#fff" cx="37.2" cy="28.8" r="0.7" opacity="0.85"/>
            <path fill="none" stroke="#c9a227" stroke-width="1.4" d="M30 36c1 2 3 2 4 0"/>

            <ellipse fill="#222" cx="32" cy="38" rx="22" ry="18"/>

            <ellipse fill="#1a1a1a" cx="38" cy="22" rx="1" ry="1.9"/>
            <circle fill="#fff" cx="25.3" cy="20.9" r="0.6" opacity="0.9"/>

            <path fill="#111" d="M10 36c2-14 12-24 22-24s20 10 22 24c4 4 8 10 4 18-6 8-18 10-26 10s-20-2-26-10c-4-8 0-14 4-18z"/>
            <path fill="#111" d="M22 14l-8-12 14 8M42 14l8-12-14 8"/>
            <ellipse fill="#6b8e3a" cx="26" cy="32" rx="3" ry="3.3"/>
            <ellipse fill="#6b8e3a" cx="38" cy="32" rx="3" ry="3.3"/>
            <ellipse fill="#111" cx="26" cy="32" rx="1.05" ry="2.1"/>
            <ellipse fill="#111" cx="38" cy="32" rx="1.05" ry="2.1"/>
            <circle fill="#fff" cx="25.2" cy="30.7" r="0.65" opacity="0.85"/>
            <circle fill="#fff" cx="37.2" cy="30.7" r="0.65" opacity="0.85"/>
            <path stroke="#c9a227" stroke-width="1.2" fill="none" d="M28 38h8M24 40l-8 2M40 40l8 2M24 42l-6 4M40 42l6 4"/>

        <symbol id="cat-d" viewBox="0 0 64 64">
            <ellipse fill="#2a2a2a" cx="30" cy="40" rx="20" ry="16"/>

            <ellipse fill="#7eb8d4" cx="30" cy="24" rx="2.8" ry="3"/>
            <ellipse fill="#7eb8d4" cx="40" cy="24" rx="2.8" ry="3"/>
            <ellipse fill="#1a1a1a" cx="30" cy="24" rx="1" ry="1.9"/>
            <ellipse fill="#1a1a1a" cx="40" cy="24" rx="1" ry="1.9"/>
            <circle fill="#fff" cx="29.3" cy="22.9" r="0.6" opacity="0.9"/>
            <circle fill="#fff" cx="39.3" cy="22.9" r="0.6" opacity="0.9"/>
            <path fill="#2a2a2a" d="M48 36c10 0 16 12 10 18s-14-2-16-8"/>

    </svg>

    <script>
        (function () {
            const I18N = {
                uk: {
                    back: '← На головну',
                    hint: '🐱 Клікай котика — він скаже правду · Рухай мишкою · Клік = більше котів',
                    'hide-footer': 'Сховати підказку',
                    'show-footer': 'Показати підказку',
                    phrases: [
                        'Слава Україні!',
                        'Героям слава!',
                        'Слава нації!',
                        'Смерть ворогам!',
                        'Україна понад усе!',
                        'Все буде Україна!',
                        'Герої не вмирають!',
                        'Батько наш — Бандера, Україна — мати.',
                        'Хай живе вільна Україна!',
                        'Воля або смерть.'
                    ]
                },
                en: {
                    back: '← Home',
                    hint: '🐱 Click a cat — it speaks truth · Move the mouse · Click = more cats',
                    'hide-footer': 'Hide hint',
                    'show-footer': 'Show hint',
                    phrases: [
                        'Glory to Ukraine!',
                        'Glory to the heroes!',
                        'Glory to the nation!',
                        'Death to the enemies!',
                        'Ukraine above all!',
                        'Everything will be Ukraine!',
                        'Heroes never die!',
                        'Our father is Bandera, Ukraine is our mother.',
                        'Long live free Ukraine!',
                        'Freedom or death.'
                    ]
                }
            };

            let lang = localStorage.getItem('cat_lang') || 'uk';
            const CAT_SRCS = [
                { id: 'cat-a' }, { id: 'cat-b' }, { id: 'cat-c' }, { id: 'cat-d' }
            ];

            const stage = document.getElementById('stage');
            const edges = document.getElementById('edges');
            const blotchesEl = document.getElementById('blotches');
            const dot = document.getElementById('dot');
            const hintEl = document.getElementById('hint');
            const footerToggle = document.getElementById('footerToggle');
            const langBtns = document.querySelectorAll('.lang-btn');

            let mx = window.innerWidth / 2;
            let my = window.innerHeight / 2;
            let mouseActive = false;
            let lastMouseMove = performance.now();
            const trails = [];
            const blotchList = [];
            const MAX_CATS = 9;          // обмеження на кількість призваних котів
            const MAX_BLOTCH_AREA = 0.15; // максимум 15% площі екрана

            function applyI18n() {
                const t = I18N[lang] || I18N.uk;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (key === 'hide-footer' || key === 'show-footer') return;
                    if (t[key]) el.textContent = t[key];
                });
                document.documentElement.lang = lang;
                langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
                updateFooterBtn();
            }

            function updateFooterBtn() {
                const t = I18N[lang] || I18N.uk;
                const hidden = hintEl.classList.contains('hidden');
                footerToggle.textContent = hidden ? t['show-footer'] : t['hide-footer'];
            }

            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    lang = btn.dataset.lang;
                    localStorage.setItem('cat_lang', lang);
                    applyI18n();
                });
            });

            if (localStorage.getItem('cat_hint_hidden') === '1') {
                hintEl.classList.add('hidden');
            }
            footerToggle.addEventListener('click', () => {
                hintEl.classList.toggle('hidden');
                localStorage.setItem('cat_hint_hidden', hintEl.classList.contains('hidden') ? '1' : '0');
                updateFooterBtn();
            });

            /* ========== КЛЯКСИ ========== */
            function placeBlotches() {
                const W = window.innerWidth;
                const H = window.innerHeight;
                const screenArea = W * H;
                let usedArea = 0;

                // розміри: крихітні / малі / середні (без великих)
                // max ≈ 7–8 % від меншої сторони
                const maxSize = Math.min(W, H) * 0.08;

                const sizeClasses = [
                    () => 18 + Math.random() * 16,          // крихітні 18–34
                    () => 32 + Math.random() * 22,          // малі    32–54
                    () => 48 + Math.random() * (maxSize - 48) // середні до maxSize
                ];

                // намагаємося поставити 5–9 клякс, але не перевищити 15% площі
                const targetCount = 5 + Math.floor(Math.random() * 5);

                for (let i = 0; i < targetCount; i++) {
                    const sizeFn = sizeClasses[Math.floor(Math.random() * sizeClasses.length)];
                    let size = sizeFn();
                    size = Math.min(size, maxSize);

                    const area = Math.PI * (size / 2) * (size / 2) * 0.7; // приблизна площа з урахуванням форми
                    if (usedArea + area > screenArea * MAX_BLOTCH_AREA) break;

                    const x = Math.random() * (W - size - 20) + 10;
                    const y = Math.random() * (H - size - 20) + 10;

                    spawnBlotch(x, y, size);
                    usedArea += area;
                }
            }

            function spawnBlotch(x, y, size) {
                const el = document.createElement('div');
                el.className = 'blotch';
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg) scale(' + (0.75 + Math.random() * 0.5) + ')';
                el.style.opacity = (0.30 + Math.random() * 0.18).toFixed(2);
                blotchesEl.appendChild(el);

                const data = { el, x, y, size };
                blotchList.push(data);

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 5% шанс стати двома
                    if (Math.random() < 0.05) {
                        const nx = x + (Math.random() - 0.5) * size * 1.3;
                        const ny = y + (Math.random() - 0.5) * size * 1.3;
                        const ns = size * (0.55 + Math.random() * 0.35);
                        spawnBlotch(
                            Math.max(0, Math.min(window.innerWidth - ns, nx)),
                            Math.max(0, Math.min(window.innerHeight - ns, ny)),
                            ns
                        );
                        el.style.transform += ' scale(1.12)';
                        setTimeout(() => {
                            el.style.transform = el.style.transform.replace(' scale(1.12)', '');
                        }, 220);
                    }
                });
                return data;
            }

            placeBlotches();

            const pageCat = CAT_SRCS[Math.floor(Math.random() * CAT_SRCS.length)];

            function makeCatEl(src) {
                const el = document.createElement('div');
                el.className = 'cat';
                el.innerHTML = '<svg viewBox="0 0 64 64"><use href="#' + (src ? src.id : pageCat.id) + '"/></svg>';
                return el;
            }

            function placeEdgeCats() {
                const W = window.innerWidth;
                const H = window.innerHeight;
                const placements = [
                    { left: -40, top: H * 0.15, w: 90, rot: 25 },
                    { left: W - 50, top: H * 0.25, w: 80, rot: -30 },
                    { left: W * 0.2, top: -35, w: 100, rot: 10 },
                    { left: W * 0.65, top: H - 45, w: 85, rot: -8 },
                    { left: -30, top: H * 0.7, w: 70, rot: 40 },
                    { left: W - 40, top: H * 0.75, w: 75, rot: -20 }
                ];
                placements.forEach((p, i) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'edge-cat';
                    wrap.style.left = p.left + 'px';
                    wrap.style.top = p.top + 'px';
                    wrap.style.width = p.w + 'px';
                    wrap.style.height = p.w + 'px';
                    wrap.style.transform = 'rotate(' + p.rot + 'deg)';
                    wrap.innerHTML = '<svg viewBox="0 0 64 64" width="100%" height="100%"><use href="#cat-' + ['a','b','c','d'][i % 4] + '"/></svg>';
                    edges.appendChild(wrap);
                });
            }
            placeEdgeCats();

            function isOnBlotch(cx, cy, catSize) {
                const r = catSize * 0.35;
                for (const b of blotchList) {
                    const bx = b.x + b.size / 2;
                    const by = b.y + b.size / 2;
                    const br = b.size * 0.45;
                    if (Math.hypot(cx - bx, cy - by) < r + br) return true;
                }
                return false;
            }

            class Cat {
                constructor(x, y, src, ephemeral) {
                    this.el = makeCatEl(src || pageCat);
                    this.x = x ?? Math.random() * window.innerWidth;
                    this.y = y ?? Math.random() * window.innerHeight;
                    this.vx = 0;
                    this.vy = 0;
                    this.stiffness = 0.06 + Math.random() * 0.09;
                    this.damping = 0.76 + Math.random() * 0.12;
                    this.maxSpeed = 11 + Math.random() * 10;
                    this.size = 46 + Math.random() * 22;
                    this.el.style.width = this.size + 'px';
                    this.el.style.height = this.size + 'px';
                    this.trailTimer = 0;
                    this.facing = 1;
                    this.bubbleType = 1 + Math.floor(Math.random() * 3);
                    this.dead = false;
                    this.ephemeral = !!ephemeral;
                    this.immortal = false;
                    this.bubble = null;
                    this.bubbleUntil = 0;

                    // Idle wander
                    this.idleTx = this.x;
                    this.idleTy = this.y;
                    this.idleNext = performance.now() + 800 + Math.random() * 2000;
                    this.phase = Math.random() * Math.PI * 2;

                    stage.appendChild(this.el);
                    this.el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (this.dead) return;
                        this.speak();
                        // 3% шанс, якщо стоїть на кляксі → синьо-жовтий значок + безсмертя
                        if (!this.immortal && isOnBlotch(this.x, this.y, this.size) && Math.random() < 0.03) {
                            this.grantBadge();
                        }
                    });
                    this.render();

                    // усі коти (крім безсмертних) з часом зникають
                    const lifeMs = this.ephemeral
                        ? 3500 + Math.random() * 9000
                        : 12000 + Math.random() * 25000; // стартові живуть довше
                    this.lifeTimer = setTimeout(() => {
                        if (!this.immortal) this.fadeOut();
                    }, lifeMs);
                }

                grantBadge() {
                    this.immortal = true;
                    this.ephemeral = false;
                    if (this.lifeTimer) clearTimeout(this.lifeTimer);
                    if (!this.el.querySelector('.ua-badge')) {
                        const badge = document.createElement('div');
                        badge.className = 'ua-badge';
                        this.el.appendChild(badge);
                    }
                }

                fadeOut() {
                    if (this.dead || this.immortal) return;
                    this.dead = true;
                    if (this.bubble) {
                        this.bubble.classList.add('out');
                        setTimeout(() => { if (this.bubble) { this.bubble.remove(); this.bubble = null; } }, 360);
                    }
                    this.el.classList.add('fading');
                    setTimeout(() => {
                        this.el.remove();
                        const idx = cats.indexOf(this);
                        if (idx !== -1) cats.splice(idx, 1);
                    }, 950);
                }

                speak() {
                    const phrases = (I18N[lang] || I18N.uk).phrases;
                    const phrase = phrases[Math.floor(Math.random() * phrases.length)];

                    if (this.bubble) {
                        this.bubble.remove();
                        this.bubble = null;
                    }
                    const b = document.createElement('div');
                    b.className = 'bubble b' + this.bubbleType;
                    b.textContent = phrase;
                    document.body.appendChild(b);
                    this.bubble = b;
                    this.bubbleUntil = performance.now() + 2400;
                    this.positionBubble();
                }

                positionBubble() {
                    if (!this.bubble) return;
                    const left = Math.max(8, Math.min(window.innerWidth - 230, this.x - 50));
                    const top = Math.max(8, this.y - this.size - 52);
                    this.bubble.style.left = left + 'px';
                    this.bubble.style.top = top + 'px';
                }

                pickIdleTarget() {
                    const margin = 40;
                    this.idleTx = margin + Math.random() * (window.innerWidth - margin * 2);
                    this.idleTy = margin + Math.random() * (window.innerHeight - margin * 2);
                    this.idleNext = performance.now() + 1500 + Math.random() * 3500;
                }

                update(now) {
                    if (this.dead) return;

                    const idle = !mouseActive || (now - lastMouseMove > 1800);
                    let tx = mx, ty = my;

                    if (idle) {
                        if (now > this.idleNext || Math.hypot(this.x - this.idleTx, this.y - this.idleTy) < 30) {
                            this.pickIdleTarget();
                        }
                        // легкий бродячий рух + маленьке похитування
                        tx = this.idleTx + Math.sin(now * 0.001 + this.phase) * 18;
                        ty = this.idleTy + Math.cos(now * 0.0012 + this.phase) * 14;
                    }

                    const dx = tx - this.x;
                    const dy = ty - this.y;
                    const dist = Math.hypot(dx, dy) || 1;

                    const forceScale = idle ? 8 : 18;
                    const pull = Math.min(dist, idle ? 200 : 280) / (idle ? 200 : 280);
                    const ax = (dx / dist) * this.stiffness * pull * forceScale;
                    const ay = (dy / dist) * this.stiffness * pull * forceScale;

                    this.vx += ax;
                    this.vy += ay;
                    this.vx *= idle ? 0.88 : this.damping;
                    this.vy *= idle ? 0.88 : this.damping;

                    const maxSp = idle ? 3.5 + Math.random() * 1.5 : this.maxSpeed;
                    const sp = Math.hypot(this.vx, this.vy);
                    if (sp > maxSp) {
                        this.vx = (this.vx / sp) * maxSp;
                        this.vy = (this.vy / sp) * maxSp;
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    const m = this.size / 2;
                    if (this.x < m) { this.x = m; this.vx *= -0.4; }
                    if (this.x > window.innerWidth - m) { this.x = window.innerWidth - m; this.vx *= -0.4; }
                    if (this.y < m) { this.y = m; this.vy *= -0.4; }
                    if (this.y > window.innerHeight - m) { this.y = window.innerHeight - m; this.vy *= -0.4; }

                    if (Math.abs(this.vx) > 0.25) this.facing = this.vx < 0 ? -1 : 1;

                    this.trailTimer++;
                    if (sp > 2.5 && this.trailTimer % 3 === 0) {
                        const t = document.createElement('div');
                        t.className = 'trail';
                        t.style.left = this.x + 'px';
                        t.style.top = (this.y + this.size * 0.3) + 'px';
                        t.style.opacity = '0.5';
                        stage.appendChild(t);
                        trails.push({ el: t, life: 1 });
                    }

                    if (this.bubble) {
                        this.positionBubble();
                        if (now > this.bubbleUntil) {
                            this.bubble.classList.add('out');
                            const b = this.bubble;
                            this.bubble = null;
                            setTimeout(() => b.remove(), 360);
                        }
                    }

                    this.render();
                }

                render() {
                    const angle = Math.atan2(this.vy, this.vx) * (180 / Math.PI) * 0.15;
                    this.el.style.left = this.x + 'px';
                    this.el.style.top = this.y + 'px';
                    this.el.style.transform =
                        'translate(-50%, -50%) scaleX(' + this.facing + ') rotate(' + angle + 'deg)';
                }
            }

            const cats = [
                new Cat(window.innerWidth * 0.3, window.innerHeight * 0.4, null, false),
                new Cat(window.innerWidth * 0.6, window.innerHeight * 0.5, null, false)
            ];

            window.addEventListener('mousemove', (e) => {
                mx = e.clientX;
                my = e.clientY;
                mouseActive = true;
                lastMouseMove = performance.now();
                dot.style.left = mx + 'px';
                dot.style.top = my + 'px';
            });

            window.addEventListener('click', (e) => {
                if (e.target.closest('a') || e.target.closest('.cat') || e.target.closest('.blotch') || e.target.closest('.top-bar')) return;

                // обмеження на 9 котів
                const alive = cats.filter(c => !c.dead).length;
                if (alive >= MAX_CATS) {
                    // прибираємо найстарішого ефемерного
                    const ephemeral = cats.find(c => c.ephemeral && !c.dead && !c.immortal);
                    if (ephemeral) ephemeral.fadeOut();
                    else return; // якщо всі безсмертні — більше не додаємо
                }

                const src = CAT_SRCS[Math.floor(Math.random() * CAT_SRCS.length)];
                cats.push(new Cat(e.clientX, e.clientY, src, true));
            });

            window.addEventListener('touchmove', (e) => {
                if (e.touches[0]) {
                    mx = e.touches[0].clientX;
                    my = e.touches[0].clientY;
                    mouseActive = true;
                    lastMouseMove = performance.now();
                    dot.style.left = mx + 'px';
                    dot.style.top = my + 'px';
                }
            }, { passive: true });

            function loop(now) {
                for (const c of cats) c.update(now);
                for (let i = trails.length - 1; i >= 0; i--) {
                    const t = trails[i];
                    t.life -= 0.04;
                    t.el.style.opacity = String(Math.max(0, t.life * 0.5));
                    t.el.style.transform = 'translate(-50%, -50%) scale(' + t.life + ')';
                    if (t.life <= 0) {
                        t.el.remove();
                        trails.splice(i, 1);
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
            applyI18n();
        })();
    </script>
</body>
    </html>
