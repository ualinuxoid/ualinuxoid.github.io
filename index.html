<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lintweak – Linux tweaks in pure bash | Privacy, Tor, Adblock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f4f6f9;--card:#ffffff;--text:#1e1e2f;--muted:#64748b;--border:#e5e7eb;--accent:#2563eb;--accent-soft:#e0e7ff;--code-bg:#1e293b;--code-fg:#a6e22e;--shadow:0 20px 60px rgba(0,0,0,0.08);--radius:20px;--font:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
body.dark{--bg:#1a1b26;--card:#24283b;--text:#d4d4d4;--muted:#a9b1d6;--border:#3b4261;--accent:#7aa2f7;--accent-soft:#3b4261;--code-bg:#0f111a;--code-fg:#9ece6a;--shadow:0 20px 60px rgba(0,0,0,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;padding:20px;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:36px 50px 40px}
@media(max-width:640px){.container{padding:18px 16px;border-radius:18px}body{padding:10px}.header h1{font-size:1.75rem}.script-title{font-size:1.08rem}.script-item{padding:14px 16px}.header-bar{gap:10px}.nav a{font-size:.88rem}.sp-btn{padding:5px 12px;font-size:.75rem}.cmd-block{font-size:.8rem;padding:10px 12px}.src-btn{width:30px;height:30px;font-size:.9rem}}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.header{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;gap:16px}
.header h1{font-size:2.2rem;font-weight:750;letter-spacing:-.6px;margin:0;text-align:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;width:100%;gap:12px}
.nav{display:flex;flex-wrap:wrap;gap:4px 14px}
.nav a{font-weight:600;color:var(--muted);font-size:.95rem}.nav a:hover,.nav a.active{color:var(--accent);text-decoration:none}
.header-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang-switch{display:flex;gap:4px;background:var(--accent-soft);border-radius:40px;padding:4px}
.lang-btn{border:none;background:transparent;padding:6px 14px;border-radius:30px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);font-family:var(--font);transition:transform .12s,background .15s,box-shadow .15s}
.lang-btn:active{transform:scale(.94)}.lang-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.icon-btn{background:none;border:none;font-size:1.25rem;cursor:pointer;padding:4px 8px;border-radius:30px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .15s}
.icon-btn:hover{background:rgba(0,0,0,.06);transform:scale(1.08)}.icon-btn:active{transform:scale(.9)}
body.dark .icon-btn:hover{background:rgba(255,255,255,.08)}
.lang-block{display:none}.lang-block.active{display:block}
.desc{background:color-mix(in srgb,var(--accent-soft) 55%,transparent);padding:16px 20px;border-radius:16px;margin-bottom:28px;border-left:4px solid var(--accent)}
.desc p{margin-bottom:.45rem}.desc p:last-child{margin-bottom:0}
.badge{display:inline-block;background:var(--accent-soft);padding:.15rem .75rem;border-radius:30px;font-size:.75rem;font-weight:650;color:var(--accent);margin-right:6px}
.scripts-list{display:flex;flex-direction:column;gap:18px}
.script-item{border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px}.script-item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.script-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;cursor:pointer;user-select:none}
.script-title{font-size:1.22rem;font-weight:650;display:flex;align-items:center;gap:10px}.script-title .icon{font-size:1.5rem}
.script-title .name{background:linear-gradient(135deg,#1e293b,#475569);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
body.dark .script-title .name{background:linear-gradient(135deg,#c0caf5,#a9b1d6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sp-btn{background:var(--accent-soft);border:none;padding:6px 14px;border-radius:30px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:var(--font);transition:transform .12s,background .15s,filter .15s}
.sp-btn:active{transform:scale(.96);filter:brightness(.95)}.sp-btn .arrow{display:inline-block;transition:transform .3s}.sp-btn.open .arrow{transform:rotate(180deg)}
.script-desc{margin:10px 0 4px;color:var(--muted);font-size:.95rem;line-height:1.55}
.script-desc-wrap{display:flex;align-items:flex-start;gap:10px;margin:10px 0 4px}
.script-desc-wrap .script-desc{flex:1;margin:0}
.src-btn{flex-shrink:0;background:var(--accent-soft);border:none;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .15s,filter .15s;font-family:var(--font);line-height:1}
.src-btn:hover{filter:brightness(.95);transform:scale(1.08)}.src-btn:active{transform:scale(.92)}.src-btn.open{background:color-mix(in srgb,var(--accent) 25%,var(--accent-soft))}
.src-content{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .25s ease,margin .25s ease;padding:0 4px;margin:0;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-radius:12px;border-left:3px solid var(--border)}
.src-content.open{max-height:100px;padding:10px 16px;margin-top:8px}
.src-links{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:.92rem}
.src-links a{font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sp-content{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .25s ease,margin .25s ease;padding:0 4px;margin:0;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-radius:12px;border-left:3px solid var(--border)}
.sp-content.open{max-height:520px;padding:14px 18px;margin-top:12px}
.cmd-block{background:var(--code-bg);border-radius:12px;padding:11px 15px;margin:7px 0;overflow-x:auto;font-family:var(--font-mono);font-size:.86rem}
.cmd-block code{color:var(--code-fg);white-space:pre-wrap;word-break:break-all}
.cmd-block .cmd-label{color:#94a3b8;font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px;font-weight:600}
.note{font-size:.88rem;color:var(--muted);margin-top:6px;font-style:italic}
hr{border:none;border-top:2px dashed var(--border);margin:28px 0 16px}
.footer{margin-top:8px;text-align:center;font-size:.84rem;color:var(--muted)}
.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-bottom:10px}
.footer-links a{color:var(--muted);font-weight:500}.footer-links a:hover{color:var(--accent)}
.footer-tagline{font-size:.82rem;color:var(--muted);opacity:.85}
#ru-block{display:none;position:fixed;inset:0;background:#0a0a0a;z-index:9999;align-items:center;justify-content:center;padding:24px;flex-direction:column;text-align:center}
#ru-block.ru-visible{display:flex}#main-content.ru-hidden{display:none!important}
#ru-block .panel{max-width:520px;color:#f1f5f9;font-family:var(--font)}
.ru-title{font-size:1.85rem;font-weight:800;margin-bottom:1rem;color:#f87171}
.ru-text{font-size:1.12rem;line-height:1.55;margin-bottom:.8rem;color:#e2e8f0}
.ru-ship{font-size:1.3rem;font-weight:700;color:#fbbf24;margin:1.4rem 0 .6rem;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ru-ship img{width:42px;height:42px;object-fit:contain}
.ru-arrow{font-size:2rem;margin:.3rem 0 .8rem;animation:drift 2.2s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.ru-phrase{font-size:.78rem;color:#94a3b8;opacity:.45;margin:.8rem auto 1rem;max-width:90%;line-height:1.4;font-weight:500}
.ru-sub{font-size:.9rem;color:#94a3b8;margin-top:1rem}
.ru-unlock{margin-top:1.6rem}
.ru-btn{background:linear-gradient(135deg,#334155,#1e293b);color:#e2e8f0;border:1px solid #475569;padding:12px 22px;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font)}
.ru-btn:hover{background:linear-gradient(135deg,#475569,#334155);border-color:#64748b;transform:translateY(-1px)}.ru-btn:active{transform:scale(.96)}
.ru-prove{display:none;margin-top:1.2rem}.ru-prove.visible{display:block}
.ru-prove-title{font-size:1.25rem;font-weight:700;color:#fbbf24;margin-bottom:.8rem}
.ru-input{width:100%;max-width:280px;padding:12px 16px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#f1f5f9;font-size:1rem;text-align:center;margin-bottom:10px;font-family:var(--font)}
.ru-input:focus{outline:none;border-color:#7aa2f7;box-shadow:0 0 0 3px rgba(122,162,247,.25)}
.ru-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.ru-hint-btn{background:transparent;border:1px dashed #64748b;color:#94a3b8;padding:8px 14px;border-radius:8px;font-size:.85rem;cursor:pointer;font-family:var(--font)}
.ru-hint-btn:hover{border-color:#94a3b8;color:#e2e8f0}
.ru-hint-text{display:none;margin-top:10px;font-size:.85rem;color:#94a3b8;background:#1e293b;padding:10px 14px;border-radius:8px}.ru-hint-text.visible{display:block}
.ru-error{color:#f87171;font-size:.9rem;margin-top:8px;display:none}.ru-error.visible{display:block}
</style>
</head>
<body>
<div class="container">
<div id="ru-block" role="alertdialog" aria-modal="true" aria-labelledby="ru-title" aria-hidden="true">
<div class="panel">
<div class="ru-title" id="ru-title">Access denied</div>
<div class="ru-text">Your browser language and/or timezone indicate Russia.</div>
<div class="ru-text">This site is not for you.</div>
<div class="ru-ship">You should go in the direction of your warship <img src="/assets/warship.png" alt="warship" width="42" height="42"></div>
<div class="ru-arrow" aria-hidden="true">→</div>
<div class="ru-phrase" id="ru-phrase"></div>
<div class="ru-sub">Слава Україні · Glory to Ukraine</div>
<div class="ru-unlock">
<button type="button" class="ru-btn" id="not-ru-btn">I am not russian</button>
<div class="ru-prove" id="ru-prove">
<div class="ru-prove-title">Prove it 😈</div>
<input type="text" class="ru-input" id="ru-input" placeholder="Type here..." autocomplete="off" spellcheck="false">
<div class="ru-actions">
<button type="button" class="ru-btn" id="ru-submit">Submit</button>
<button type="button" class="ru-hint-btn" id="ru-hint-btn">підказка / hint</button>
</div>
<div class="ru-hint-text" id="ru-hint-text">Введи «Слава Україні» або «Glory to Ukraine»</div>
<div class="ru-error" id="ru-error">Nope. Try again.</div>
</div>
</div>
</div>
</div>

<div id="main-content">
<div class="header">
    <h1>⚡ Lintweak</h1>
    <div class="header-bar">
        <div class="nav">
            <a href="/" class="active" data-i18n="nav-home">🏠 Home</a>
            <a href="/experimental" data-i18n="nav-exp">🧪 Experimental</a>
            <a href="/me" data-i18n="nav-about">👤 About</a>
        </div>
        <div class="header-controls">
            <div class="lang-switch" role="group" aria-label="Language">
                <button class="lang-btn active" data-lang="uk" type="button">🇺🇦 Укр</button>
                <button class="lang-btn" data-lang="en" type="button">🇬🇧 Eng</button>
            </div>
            <a class="icon-btn" href="/cat/" title="🐱" aria-label="Cat easter egg">🐱</a>
            <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">🌓</button>
        </div>
    </div>
</div>
